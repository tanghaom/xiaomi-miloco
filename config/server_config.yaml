# Miloco Server Configuration
# Unified management of all server configuration items

# Directory path configuration
# Storage directory can be overridden by environment variable MILOCO_SERVER_STORAGE_DIR
# Default to relative path for portability
directories:
  templates: "templates"
  static: "static"
  storage: ".temp"  # Can be overridden by MILOCO_SERVER_STORAGE_DIR env var

# Database configuration
database:
  path: "miloco.db"
  timeout: 30.0 
  check_same_thread: false
  isolation_level: null

# Server configuration
server:
  host: "0.0.0.0"
  port: 18000
  log_level: "info"
  enable_console_logging: true
  enable_file_logging: true
  # Public URL for external access (e.g., for pushplus image links)
  # Set this to your public accessible URL if you want to include images in push notifications
  # Example: "https://your-domain.com:18000" or "https://your-ngrok-url.ngrok.io"
  # Can be overridden by environment variable MILOCO_PUBLIC_URL
  public_url: "https://xxxx"

# Application information configuration
app:
  title: "Miloco server"
  service_name: "miloco-server"
  description: "Miloco server, responsible for scheduling various modules"
  version: "0.0.1"

# JWT authentication configuration
jwt:
  secret_key: "your-super-secret-key-change-this"  # Get from environment variable SECRET_KEY, default to this value
  algorithm: "HS256"
  access_token_expire_minutes: 1440  #minutes

# Local model configuration
local_model:
  host: "0.0.0.0"
  port: 8111

# Chat configuration
chat:
  agent_max_steps: 10
  vision_use_img_count: 6
  chat_history_ttl: 1 #days

# Trigger rule runner configuration
trigger_rule_runner:
  interval_seconds: 30
  vision_use_img_count: 6
  trigger_rule_log_ttl: 7 #days

# Camera configuration
camera:
  frame_interval: 1500 # Unit: Millisecond (ms)


# Login rate limiting configuration (brute force protection)
# Blocks IP after too many failed login attempts
rate_limit:
  max_failed_attempts: 3           # Maximum failed login attempts before blocking
  block_duration_seconds: 3600      # Block duration in seconds (default: 15 minutes)
  attempt_window_seconds: 600      # Time window for counting failed attempts (default: 10 minutes)

# Cloudflare Turnstile configuration (human verification)
# Get your keys from: https://dash.cloudflare.com/?to=/:account/turnstile
# Set enabled to true and fill in your keys to enable Turnstile protection
turnstile:
  enabled: true                    # Set to true to enable Turnstile verification
  site_key: "0x4AAAAAACCxxxxxx"                      # Your Turnstile site key (public, used in frontend)
  secret_key: "0x4AAAAAACCxxxxxx"                    # Your Turnstile secret key (private, used in backend)

# MIoT configuration, default to 'cn', use your MiHome cloud server
  # 'cn': '中国大陆'
  # 'de': 'Europe'
  # 'i2': 'India'
  # 'ru': 'Russia'
  # 'sg': 'Singapore'
  # 'us': 'United States
miot:
  cloud_server: "cn"
